services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
      args:
        - PENULTIMATE_DEBIAN_STABLE_VERSION=${PENULTIMATE_DEBIAN_STABLE_VERSION}
    container_name: mariadb-test
    env_file: .env
    volumes:
      - mariadb_data:/var/lib/mysql:rw
    networks:
      - inception
    secrets:
      - db_credentials
      - db_password
      - db_root_password
    restart: always

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
      args:
        - PENULTIMATE_DEBIAN_STABLE_VERSION=${PENULTIMATE_DEBIAN_STABLE_VERSION}
        - PHP_VERSION=${PHP_VERSION}
    container_name: wordpress-test
    depends_on:
      - mariadb
    env_file: .env
    volumes:
      - wordpress_data:/var/www/html:rw
    networks:
      - inception
    secrets:
      - db_credentials
      - db_password
      - db_root_password
      - wp_admin_credentials
      - wp_admin_password
      - wp_user_credentials
      - wp_user_password
    restart: always

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
      args:
        - PENULTIMATE_ALPINE_STABLE_VERSION=${PENULTIMATE_ALPINE_STABLE_VERSION}
        - DOMAIN_NAME=${DOMAIN_NAME}
    container_name: nginx-test
    ports:
      - "443:443"
      # - "80:80"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    restart: always

  adminer:
    build:
      context: ./requirements/adminer
      dockerfile: Dockerfile
      args:
        - PENULTIMATE_ALPINE_STABLE_VERSION=${PENULTIMATE_ALPINE_STABLE_VERSION}
    container_name: adminer-test
    depends_on:
      - mariadb
    networks:
      - inception
    restart: always

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_MOUNT_PATH}/mariadb
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_MOUNT_PATH}/wordpress

networks:
  inception:
    driver: bridge
    name: inception

secrets:
  db_credentials:
    name: db_credentials
    file: ../secrets/db_credentials.txt
  db_password:
    name: db_password
    file: ../secrets/db_password.txt
  db_root_password:
    name: db_root_password
    file: ../secrets/db_root_password.txt
  wp_admin_credentials:
    name: wp_admin_credentials
    file: ../secrets/wp_admin_credentials.txt
  wp_admin_password:
    name: wp_admin_password
    file: ../secrets/wp_admin_password.txt
  wp_user_credentials:
    name: wp_user_credentials
    file: ../secrets/wp_user_credentials.txt
  wp_user_password:
    name: wp_user_password
    file: ../secrets/wp_user_password.txt
