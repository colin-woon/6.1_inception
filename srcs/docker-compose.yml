services:
    mariadb:
        build:
            context: ./requirements/mariadb
            dockerfile: Dockerfile
            args:
                - PENULTIMATE_DEBIAN_STABLE_VERSION=${PENULTIMATE_DEBIAN_STABLE_VERSION}
        container_name: mariadb-test
        env_file: .env
        volumes:
            - mariadb_data:/var/lib/mysql:rw
        networks:
            - inception
        restart: always

    wordpress:
        build:
            context: ./requirements/wordpress
            dockerfile: Dockerfile
            args:
                - PENULTIMATE_DEBIAN_STABLE_VERSION=${PENULTIMATE_DEBIAN_STABLE_VERSION}
                - PHP_VERSION=${PHP_VERSION}
        container_name: wordpress-test
        depends_on:
            - mariadb
        env_file: .env
        volumes:
            - wordpress_data:/var/www/html:rw
        networks:
            - inception
        restart: always

    nginx:
        build:
            context: ./requirements/nginx
            dockerfile: Dockerfile
            args:
                - PENULTIMATE_ALPINE_STABLE_VERSION=${PENULTIMATE_ALPINE_STABLE_VERSION}
                - DOMAIN_NAME=${DOMAIN_NAME}
        container_name: nginx-test
        ports:
            - "443:443"
            # - "80:80"
        volumes:
            - wordpress_data:/var/www/html:ro
        networks:
            - inception
        restart: always

volumes:
    mariadb_data:
        name: mariadb_data
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/cwoon/data/mariadb
    wordpress_data:
        name: wordpress_data
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/cwoon/data/wordpress

networks:
    inception:
        driver: bridge
        name: inception
